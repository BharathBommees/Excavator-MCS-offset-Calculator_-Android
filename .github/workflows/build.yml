name: Build Android APK

# Runs automatically on every push to main, and can also be triggered
# manually from the Actions tab ("Run workflow" button).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip build-essential \
            libffi-dev libssl-dev zlib1g-dev libbz2-dev

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Clean and Build the APK (auto-retries on transient network errors)
        run: |
          set +e
          for attempt in 1 2 3 4 5; do
            echo "=== Build attempt $attempt of 5 ==="
            buildozer android clean
            buildozer android debug
            if [ $? -eq 0 ]; then
              echo "Build succeeded on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed, waiting 60s before retry..."
            sleep 60
          done
          echo "All 5 attempts failed."
          exit 1

      - name: Upload APK as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: excavator-offset-calculator-apk
          path: bin/*.apk
